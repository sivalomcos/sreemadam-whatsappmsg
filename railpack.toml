[packages]
# Core GLib / GObject runtime
libglib2.0-0 = "*"

# X11 display and input libraries
libx11-6 = "*"
libxrandr2 = "*"
libxinerama1 = "*"
libxcursor1 = "*"
libxi6 = "*"
libxtst6 = "*"
libxext6 = "*"
libxss1 = "*"
libxcomposite1 = "*"
libxdamage1 = "*"
libxfixes3 = "*"
libxrender1 = "*"

# Font rendering
libfreetype6 = "*"
libfontconfig1 = "*"
fonts-liberation = "*"

# Graphics / GPU stubs (needed even with --disable-gpu)
libgl1-mesa-glx = "*"
libgbm1 = "*"
libdrm2 = "*"

# Networking and security (Chrome sandbox / HTTPS)
libnss3 = "*"
libnspr4 = "*"
libatk1.0-0 = "*"
libatk-bridge2.0-0 = "*"
libcups2 = "*"
libdbus-1-3 = "*"
libexpat1 = "*"

# GTK / AT-SPI (accessibility, required by Chrome)
libgtk-3-0 = "*"
libpango-1.0-0 = "*"
libcairo2 = "*"
libasound2 = "*"
